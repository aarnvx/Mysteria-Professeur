<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Créer une Session - Poudlard RP</title>
  <meta name="description" content="Créez des examens, QCM, devoirs interactifs pour vos élèves." />
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --accent-session: #a78bfa;
      --accent-session-dim: rgba(167,139,250,0.15);
      --accent-session-border: rgba(167,139,250,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; }

    canvas#bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    .page-wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    /* ── Header ── */
    .builder-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      background: rgba(10,10,18,0.85);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 50;
      flex-wrap: wrap; gap: 0.75rem;
    }

    .builder-header-left { display: flex; align-items: center; gap: 1rem; }
    .builder-back {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.1em;
      color: var(--text-dim); text-decoration: none;
      padding: 0.4rem 0.9rem; border: 1px solid var(--border); border-radius: 6px;
      transition: all 0.3s;
    }
    .builder-back:hover { color: var(--gold); border-color: var(--border-bright); }

    .builder-title-block h1 {
      font-family: 'Cinzel', serif; font-size: 1rem; font-weight: 600; color: var(--gold);
    }
    .builder-title-block p { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.1rem; }

    .builder-actions { display: flex; gap: 0.75rem; align-items: center; }

    .code-pill {
      font-family: 'Cinzel', serif; font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.2em; color: var(--accent-session);
      background: var(--accent-session-dim);
      border: 1px solid var(--accent-session-border);
      padding: 0.35rem 0.9rem; border-radius: 100px;
    }

    /* ── Main Layout ── */
    .builder-body {
      display: grid;
      grid-template-columns: 320px 1fr;
      flex: 1;
      min-height: 0;
    }

    /* ── Left Panel: Slide List ── */
    .slide-panel {
      border-right: 1px solid var(--border);
      background: rgba(10,10,18,0.6);
      display: flex; flex-direction: column;
      height: calc(100vh - 68px);
      position: sticky; top: 68px;
      overflow: hidden;
    }

    .slide-panel-header {
      padding: 1.25rem 1.25rem 0.75rem;
      border-bottom: 1px solid var(--border);
    }
    .slide-panel-header h3 {
      font-family: 'Cinzel', serif; font-size: 0.85rem; color: var(--gold); margin-bottom: 0.75rem;
    }

    .slide-type-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem;
    }

    .slide-type-btn {
      display: flex; flex-direction: column; align-items: center; gap: 0.2rem;
      padding: 0.5rem 0.25rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; transition: all 0.25s; color: var(--text-dim);
      font-size: 0.65rem; letter-spacing: 0.05em; font-family: 'Cinzel', serif;
      text-transform: uppercase;
    }
    .slide-type-btn .stb-icon { font-size: 1.3rem; }
    .slide-type-btn:hover { border-color: var(--accent-session-border); color: var(--accent-session); background: var(--accent-session-dim); }

    .slide-list {
      flex: 1; overflow-y: auto; padding: 0.75rem;
      display: flex; flex-direction: column; gap: 0.5rem;
    }

    .slide-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.65rem 0.8rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px;
      cursor: pointer; transition: all 0.25s;
      position: relative;
    }
    .slide-item:hover, .slide-item.active {
      border-color: var(--accent-session-border);
      background: var(--accent-session-dim);
    }
    .slide-item.active { box-shadow: 0 0 0 2px var(--accent-session-border); }

    .slide-num {
      font-family: 'Cinzel', serif; font-size: 0.65rem; color: var(--text-dim);
      min-width: 20px;
    }
    .slide-icon { font-size: 1.1rem; }
    .slide-info { flex: 1; min-width: 0; }
    .slide-label {
      font-size: 0.78rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .slide-type-tag {
      font-size: 0.63rem; color: var(--text-dim); font-family: 'Cinzel', serif;
    }
    .slide-del {
      background: none; border: none; cursor: pointer; color: var(--text-dim);
      font-size: 0.9rem; opacity: 0; transition: opacity 0.2s; padding: 0.2rem;
    }
    .slide-item:hover .slide-del { opacity: 1; }
    .slide-del:hover { color: #e87070; }

    .no-slides {
      text-align: center; padding: 2.5rem 1rem;
      font-family: 'Cinzel', serif; font-size: 0.75rem; letter-spacing: 0.08em;
      color: var(--text-dim); line-height: 2;
    }
    .no-slides-icon { font-size: 2.5rem; display: block; margin-bottom: 0.75rem; }

    /* ── Right Panel: Editor ── */
    .editor-panel {
      padding: 2rem 2.5rem;
      overflow-y: auto;
    }

    .editor-empty {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; min-height: 400px;
      text-align: center;
      font-family: 'Cinzel', serif; color: var(--text-dim);
    }
    .editor-empty-icon { font-size: 4rem; margin-bottom: 1.5rem; opacity: 0.4; }
    .editor-empty h3 { font-size: 1rem; color: var(--gold); margin-bottom: 0.5rem; }
    .editor-empty p { font-size: 0.82rem; line-height: 1.8; }

    .slide-editor { animation: fadeIn 0.3s ease; max-width: 780px; }

    .editor-section-title {
      font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border); padding-bottom: 0.4rem;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.25rem; }

    .slide-preview {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 1.75rem; margin-top: 1.5rem;
    }
    .slide-preview-label {
      font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.15em;
      color: var(--accent-session); margin-bottom: 1rem; text-transform: uppercase;
    }

    /* QCM Choices */
    .choices-list { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.75rem; }
    .choice-row {
      display: flex; align-items: center; gap: 0.5rem;
    }
    .choice-letter {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(201,168,76,0.1); border: 1px solid var(--border-bright);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-size: 0.75rem; color: var(--gold);
      flex-shrink: 0;
    }
    .choice-correct { background: rgba(80,180,100,0.15); border-color: rgba(80,180,100,0.4); color: #7ddb8c; }
    .choice-input {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 6px; padding: 0.4rem 0.75rem;
      font-size: 0.85rem; color: var(--text); outline: none;
      transition: border-color 0.25s;
    }
    .choice-input:focus { border-color: var(--border-bright); }
    .choice-correct-btn {
      background: none; border: none; cursor: pointer; font-size: 1.1rem;
      opacity: 0.4; transition: opacity 0.2s; padding: 0.2rem;
    }
    .choice-correct-btn.selected { opacity: 1; }
    .choice-del-btn {
      background: none; border: none; cursor: pointer; font-size: 0.9rem;
      color: var(--text-dim); opacity: 0.5; transition: opacity 0.2s;
    }
    .choice-del-btn:hover { opacity: 1; color: #e87070; }
    .add-choice-btn {
      font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.08em;
      color: var(--text-dim); background: none; border: 1px dashed var(--border);
      border-radius: 6px; padding: 0.4rem 1rem; cursor: pointer; width: 100%;
      transition: all 0.25s;
    }
    .add-choice-btn:hover { border-color: var(--accent-session-border); color: var(--accent-session); }

    /* Diaporama */
    .slides-diapo { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 0.75rem; }
    .diapo-slide {
      background: rgba(167,139,250,0.06); border: 1px solid var(--accent-session-border);
      border-radius: 10px; padding: 1rem; position: relative;
    }
    .diapo-slide-num {
      font-family: 'Cinzel', serif; font-size: 0.65rem; color: var(--accent-session);
      margin-bottom: 0.5rem;
    }
    .diapo-del {
      position: absolute; top: 0.75rem; right: 0.75rem;
      background: none; border: none; cursor: pointer; color: var(--text-dim);
      font-size: 0.9rem; opacity: 0.5;
    }
    .diapo-del:hover { opacity: 1; color: #e87070; }
    .add-diapo-btn {
      font-family: 'Cinzel', serif; font-size: 0.72rem; letter-spacing: 0.08em;
      color: var(--text-dim); background: none; border: 1px dashed var(--border);
      border-radius: 6px; padding: 0.5rem 1rem; cursor: pointer; width: 100%;
      transition: all 0.25s;
    }
    .add-diapo-btn:hover { border-color: var(--accent-session-border); color: var(--accent-session); }

    /* Toast */
    #toast-container { position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.75rem 1.25rem;
      font-size: 0.85rem; color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      animation: toastIn 0.3s ease;
    }
    .toast.success { border-color: rgba(80,180,100,0.4); color: #7ddb8c; }
    .toast.error { border-color: rgba(200,80,80,0.4); color: #e87070; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 768px) {
      .builder-body { grid-template-columns: 1fr; }
      .slide-panel { height: auto; position: static; }
      .editor-panel { padding: 1.25rem; }
    }
  </style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="page-wrap">

  <!-- Header -->
  <header class="builder-header">
    <div class="builder-header-left">
      <a href="dashboard.html" class="builder-back">← Tableau de Bord</a>
      <div class="builder-title-block">
        <h1>📋 Constructeur de Session</h1>
        <p id="header-label">Nouvelle session</p>
      </div>
    </div>
    <div class="builder-actions">
      <span class="code-pill" id="header-code">---</span>
      <button class="btn btn-sm" onclick="copyCode()" style="border-color:var(--accent-session-border); color:var(--accent-session);">📋 Copier le Code</button>
      <button class="btn btn-sm btn-primary" onclick="saveCurrentSlide(true)" style="padding:0.4rem 1.2rem;">💾 Sauvegarder</button>
    </div>
  </header>

  <div class="builder-body">

    <!-- Left: Slide list + add buttons -->
    <aside class="slide-panel">
      <div class="slide-panel-header">
        <h3>✨ Ajouter une étape</h3>
        <div class="slide-type-grid">
          <button class="slide-type-btn" onclick="addSlide('qcm')"><span class="stb-icon">🧩</span>QCM</button>
          <button class="slide-type-btn" onclick="addSlide('redaction')"><span class="stb-icon">✍️</span>Rédaction</button>
          <button class="slide-type-btn" onclick="addSlide('photo')"><span class="stb-icon">🖼️</span>Photo / PNG</button>
          <button class="slide-type-btn" onclick="addSlide('diapo')"><span class="stb-icon">📽️</span>Diaporama</button>
          <button class="slide-type-btn" onclick="addSlide('vrai_faux')"><span class="stb-icon">✅</span>Vrai / Faux</button>
          <button class="slide-type-btn" onclick="addSlide('dessin')"><span class="stb-icon">🎨</span>Dessin</button>
        </div>
      </div>
      <div class="slide-list" id="slide-list">
        <div class="no-slides">
          <span class="no-slides-icon">✨</span>
          Utilisez les boutons<br>ci-dessus pour<br>ajouter des étapes
        </div>
      </div>
    </aside>

    <!-- Right: Editor -->
    <main class="editor-panel" id="editor-panel">
      <div class="editor-empty" id="editor-empty">
        <div class="editor-empty-icon">📋</div>
        <h3>Commencez par ajouter une étape</h3>
        <p>Cliquez sur un type de question à gauche<br>pour construire votre session.</p>
      </div>
      <div class="slide-editor" id="slide-editor" style="display:none;"></div>
    </main>

  </div>
</div>

<div id="toast-container"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/data.js"></script>
<script>
  const user = requireAuthOrRedirect();
  if (!Auth.hasPermission('create_content')) {
    window.location.href = 'dashboard.html';
  }

  const SLIDE_ICONS = {
    qcm: '🧩', redaction: '✍️', photo: '🖼️',
    diapo: '📽️', vrai_faux: '✅', dessin: '🎨'
  };
  const SLIDE_LABELS = {
    qcm: 'QCM', redaction: 'Rédaction', photo: 'Photo / PNG',
    diapo: 'Diaporama', vrai_faux: 'Vrai / Faux', dessin: 'Dessin libre'
  };

  let sessionId = null;
  let sessionCode = '';
  let slides = [];         // Array of slide objects (local state)
  let activeSlideIdx = -1; // Index in slides[] currently being edited

  // ── Init: parse URL params ────────────────────────────────────────
  async function init() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    const sid = params.get('id');
    if (!sid || !code) { window.location.href = 'dashboard.html'; return; }
    sessionId = parseInt(sid);
    sessionCode = code;
    document.getElementById('header-code').textContent = code;

    // Load session info
    const sess = await DataStore.getSessionByCode(code);
    if (sess) {
      document.getElementById('header-label').textContent = sess.label + ' · ' + (sess.type || '');
    }

    // Load existing slides
    const loaded = await DataStore.getSlides(sessionId);
    slides = loaded.map(s => ({
      id: s.id,
      type: s.type,
      position: s.position,
      title: s.title || '',
      content: s.content || '',
      options: s.options ? (typeof s.options === 'string' ? JSON.parse(s.options) : s.options) : {}
    }));
    renderSlideList();
    if (slides.length > 0) selectSlide(0);
  }

  // ── Render left panel slide list ──────────────────────────────────
  function renderSlideList() {
    const list = document.getElementById('slide-list');
    if (slides.length === 0) {
      list.innerHTML = `<div class="no-slides"><span class="no-slides-icon">✨</span>Utilisez les boutons<br>ci-dessus pour<br>ajouter des étapes</div>`;
      return;
    }
    list.innerHTML = '';
    slides.forEach((s, i) => {
      const item = document.createElement('div');
      item.className = 'slide-item' + (i === activeSlideIdx ? ' active' : '');
      item.dataset.idx = i;
      item.innerHTML = `
        <span class="slide-num">${i + 1}</span>
        <span class="slide-icon">${SLIDE_ICONS[s.type] || '📄'}</span>
        <div class="slide-info">
          <div class="slide-label">${s.title || '(Sans titre)'}</div>
          <div class="slide-type-tag">${SLIDE_LABELS[s.type] || s.type}</div>
        </div>
        <button class="slide-del" onclick="deleteSlide(event, ${i})" title="Supprimer">🗑</button>
      `;
      item.addEventListener('click', (e) => {
        if (e.target.classList.contains('slide-del')) return;
        saveCurrentSlide(false);
        selectSlide(i);
      });
      list.appendChild(item);
    });
  }

  // ── Select and show editor for a slide ───────────────────────────
  function selectSlide(idx) {
    activeSlideIdx = idx;
    const s = slides[idx];
    document.getElementById('editor-empty').style.display = 'none';
    const editor = document.getElementById('slide-editor');
    editor.style.display = 'block';

    if (s.type === 'qcm') editor.innerHTML = buildQCMEditor(s, idx);
    else if (s.type === 'vrai_faux') editor.innerHTML = buildVraiFauxEditor(s, idx);
    else if (s.type === 'redaction') editor.innerHTML = buildRedactionEditor(s, idx);
    else if (s.type === 'photo') editor.innerHTML = buildPhotoEditor(s, idx);
    else if (s.type === 'dessin') editor.innerHTML = buildDessinEditor(s, idx);
    else if (s.type === 'diapo') editor.innerHTML = buildDiapoEditor(s, idx);

    renderSlideList();
  }

  // ── Slide editors ─────────────────────────────────────────────────

  function buildQCMEditor(s, idx) {
    const choices = s.options.choices || [{ text: '', correct: false }, { text: '', correct: false }];
    const choicesHtml = choices.map((c, ci) => {
      const letter = String.fromCharCode(65 + ci);
      return `<div class="choice-row" id="choice-row-${ci}">
        <div class="choice-letter ${c.correct ? 'choice-correct' : ''}">${letter}</div>
        <input class="choice-input" id="choice-${ci}" type="text" value="${escHtml(c.text)}" placeholder="Réponse ${letter}..." />
        <button class="choice-correct-btn ${c.correct ? 'selected' : ''}" onclick="toggleCorrect(${ci})" title="Marquer comme bonne réponse">✅</button>
        <button class="choice-del-btn" onclick="removeChoice(${ci})" title="Supprimer">✕</button>
      </div>`;
    }).join('');

    return `
      <p class="editor-section-title">🧩 Question à Choix Multiples</p>
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Intitulé de la question *</label>
        <input class="form-input" id="slide-title" type="text" placeholder="Ex: Quel est l'ingrédient principal de la potion de ratatinage ?" value="${escHtml(s.title)}" />
      </div>
      <div class="form-group" style="margin-bottom:0.5rem;">
        <label class="form-label">Réponses (cochez ✅ la bonne)</label>
      </div>
      <div class="choices-list" id="choices-list">${choicesHtml}</div>
      <button class="add-choice-btn" onclick="addChoice()">+ Ajouter une réponse</button>
      <div class="form-group" style="margin-top:1.25rem;">
        <label class="form-label">Points attribués si bonne réponse</label>
        <input class="form-input" id="slide-points" type="number" min="0" max="100" value="${s.options.points || 1}" style="max-width:120px;" />
      </div>
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">Explication (facultatif)</label>
        <textarea class="form-input" id="slide-explanation" rows="2" placeholder="Explication de la bonne réponse...">${escHtml(s.options.explanation || '')}</textarea>
      </div>
    `;
  }

  function buildVraiFauxEditor(s, idx) {
    const correct = s.options.correct_answer || 'vrai';
    return `
      <p class="editor-section-title">✅ Vrai / Faux</p>
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Affirmation *</label>
        <textarea class="form-input" id="slide-title" rows="3" placeholder="Ex: Le griffonnier est né à Poudlard.">${escHtml(s.title)}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Bonne réponse</label>
        <div style="display:flex; gap:0.75rem; margin-top:0.5rem;">
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="radio" name="vf" value="vrai" ${correct === 'vrai' ? 'checked' : ''} id="vf-vrai">
            <span style="font-size:1.5rem;">✅</span> <span>Vrai</span>
          </label>
          <label style="display:flex; align-items:center; gap:0.5rem; cursor:pointer;">
            <input type="radio" name="vf" value="faux" ${correct === 'faux' ? 'checked' : ''} id="vf-faux">
            <span style="font-size:1.5rem;">❌</span> <span>Faux</span>
          </label>
        </div>
      </div>
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">Points</label>
        <input class="form-input" id="slide-points" type="number" min="0" max="100" value="${s.options.points || 1}" style="max-width:120px;" />
      </div>
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">Explication (facultatif)</label>
        <textarea class="form-input" id="slide-explanation" rows="2" placeholder="Explication...">${escHtml(s.options.explanation || '')}</textarea>
      </div>
    `;
  }

  function buildRedactionEditor(s, idx) {
    return `
      <p class="editor-section-title">✍️ Question Rédactionnelle</p>
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Sujet / Consigne *</label>
        <textarea class="form-input" id="slide-title" rows="3" placeholder="Ex: Décrivez les effets de la potion Polymorphe en 5 lignes.">${escHtml(s.title)}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Précisions / Barème (facultatif)</label>
        <textarea class="form-input" id="slide-content" rows="3" placeholder="Ex: 2pts pour l'introduction, 3pts pour les effets...">${escHtml(s.content)}</textarea>
      </div>
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">Nombre de mots minimum attendu</label>
        <input class="form-input" id="slide-minwords" type="number" min="0" value="${s.options.min_words || 0}" style="max-width:120px;" placeholder="0 = pas de limite" />
      </div>
    `;
  }

  function buildPhotoEditor(s, idx) {
    return `
      <p class="editor-section-title">🖼️ Envoi de Photo / Fichier PNG</p>
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Consigne *</label>
        <textarea class="form-input" id="slide-title" rows="3" placeholder="Ex: Photographiez votre grimoire et envoyez une photo de la page 12.">${escHtml(s.title)}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Types de fichiers acceptés</label>
        <input class="form-input" id="slide-accept" type="text" value="${escHtml(s.options.accept || 'image/*,.pdf')}" placeholder="ex: image/*,.pdf" />
      </div>
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">Commentaire de correction (visible après soumission)</label>
        <textarea class="form-input" id="slide-content" rows="2" placeholder="Ce qui sera corrigé...">${escHtml(s.content)}</textarea>
      </div>
    `;
  }

  function buildDessinEditor(s, idx) {
    return `
      <p class="editor-section-title">🎨 Dessin Libre</p>
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Consigne *</label>
        <textarea class="form-input" id="slide-title" rows="3" placeholder="Ex: Dessinez le symbole de votre maison.">${escHtml(s.title)}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Précisions (facultatif)</label>
        <textarea class="form-input" id="slide-content" rows="2" placeholder="Ex: Utilisez les couleurs de votre maison.">${escHtml(s.content)}</textarea>
      </div>
      <div class="form-group" style="margin-top:1rem;">
        <label class="form-label">Taille du canvas</label>
        <select class="form-input" id="slide-canvas-size" style="max-width:200px;">
          <option value="small" ${(s.options.canvas_size||'medium')==='small' ? 'selected' : ''}>Petit (400×300)</option>
          <option value="medium" ${(s.options.canvas_size||'medium')==='medium' ? 'selected' : ''}>Moyen (600×400)</option>
          <option value="large" ${(s.options.canvas_size||'medium')==='large' ? 'selected' : ''}>Grand (800×500)</option>
        </select>
      </div>
    `;
  }

  function buildDiapoEditor(s, idx) {
    const diapos = s.options.slides || [{ title: '', body: '', img: '' }];
    const diapoHtml = diapos.map((d, di) => `
      <div class="diapo-slide" id="diapo-${di}">
        <div class="diapo-slide-num">Diapositive ${di + 1}</div>
        <button class="diapo-del" onclick="removeDiapo(${di})" title="Supprimer">✕</button>
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label class="form-label" style="font-size:0.7rem;">Titre</label>
          <input class="form-input" id="diapo-title-${di}" type="text" value="${escHtml(d.title)}" placeholder="Titre de la diapositive" style="font-size:0.85rem;" />
        </div>
        <div class="form-group" style="margin-bottom:0.75rem;">
          <label class="form-label" style="font-size:0.7rem;">Contenu</label>
          <textarea class="form-input" id="diapo-body-${di}" rows="3" placeholder="Texte, markdown supporté..." style="font-size:0.85rem;">${escHtml(d.body)}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label" style="font-size:0.7rem;">Image (URL, facultatif)</label>
          <input class="form-input" id="diapo-img-${di}" type="text" value="${escHtml(d.img)}" placeholder="https://..." style="font-size:0.85rem;" />
        </div>
      </div>
    `).join('');

    return `
      <p class="editor-section-title">📽️ Diaporama (cours en direct)</p>
      <div class="form-group" style="margin-bottom:1.25rem;">
        <label class="form-label">Titre du diaporama *</label>
        <input class="form-input" id="slide-title" type="text" value="${escHtml(s.title)}" placeholder="Ex: Introduction à la Potions" />
      </div>
      <div class="slides-diapo" id="diapos-list">${diapoHtml}</div>
      <button class="add-diapo-btn" onclick="addDiapo()">+ Ajouter une diapositive</button>
    `;
  }

  // ── QCM helpers ───────────────────────────────────────────────────
  function getChoicesState() {
    const rows = document.querySelectorAll('.choice-row');
    return Array.from(rows).map((row, ci) => ({
      text: document.getElementById(`choice-${ci}`)?.value || '',
      correct: document.getElementById(`choice-${ci}`)?.closest('.choice-row')?.querySelector('.choice-correct-btn')?.classList.contains('selected') || false
    }));
  }

  function toggleCorrect(ci) {
    const btn = document.querySelectorAll('.choice-correct-btn')[ci];
    const letter = document.querySelectorAll('.choice-letter')[ci];
    btn.classList.toggle('selected');
    letter.classList.toggle('choice-correct');
  }

  function addChoice() {
    const s = slides[activeSlideIdx];
    if (!s || s.type !== 'qcm') return;
    const current = getChoicesState();
    current.push({ text: '', correct: false });
    s.options.choices = current;
    selectSlide(activeSlideIdx);
  }

  function removeChoice(ci) {
    const s = slides[activeSlideIdx];
    if (!s) return;
    const current = getChoicesState();
    current.splice(ci, 1);
    s.options.choices = current;
    selectSlide(activeSlideIdx);
  }

  // ── Diapo helpers ─────────────────────────────────────────────────
  function getDiapoState() {
    const items = document.querySelectorAll('.diapo-slide');
    return Array.from(items).map((_, di) => ({
      title: document.getElementById(`diapo-title-${di}`)?.value || '',
      body: document.getElementById(`diapo-body-${di}`)?.value || '',
      img: document.getElementById(`diapo-img-${di}`)?.value || ''
    }));
  }

  function addDiapo() {
    const s = slides[activeSlideIdx];
    if (!s) return;
    const current = getDiapoState();
    current.push({ title: '', body: '', img: '' });
    s.options.slides = current;
    selectSlide(activeSlideIdx);
  }

  function removeDiapo(di) {
    const s = slides[activeSlideIdx];
    if (!s) return;
    const current = getDiapoState();
    current.splice(di, 1);
    s.options.slides = current;
    selectSlide(activeSlideIdx);
  }

  // ── Read current editor state ─────────────────────────────────────
  function readEditorState() {
    if (activeSlideIdx < 0 || activeSlideIdx >= slides.length) return null;
    const s = slides[activeSlideIdx];
    const titleEl = document.getElementById('slide-title');
    const contentEl = document.getElementById('slide-content');
    if (!titleEl) return null;

    const updated = {
      title: titleEl.value || '',
      content: contentEl ? contentEl.value || '' : s.content,
      options: { ...s.options }
    };

    if (s.type === 'qcm') {
      updated.options.choices = getChoicesState();
      updated.options.points = parseInt(document.getElementById('slide-points')?.value) || 1;
      updated.options.explanation = document.getElementById('slide-explanation')?.value || '';
    } else if (s.type === 'vrai_faux') {
      updated.options.correct_answer = document.querySelector('input[name="vf"]:checked')?.value || 'vrai';
      updated.options.points = parseInt(document.getElementById('slide-points')?.value) || 1;
      updated.options.explanation = document.getElementById('slide-explanation')?.value || '';
    } else if (s.type === 'redaction') {
      updated.options.min_words = parseInt(document.getElementById('slide-minwords')?.value) || 0;
    } else if (s.type === 'photo') {
      updated.options.accept = document.getElementById('slide-accept')?.value || 'image/*';
    } else if (s.type === 'dessin') {
      updated.options.canvas_size = document.getElementById('slide-canvas-size')?.value || 'medium';
    } else if (s.type === 'diapo') {
      updated.options.slides = getDiapoState();
    }

    return updated;
  }

  // ── Save current slide to local state (and optionally to DB) ──────
  async function saveCurrentSlide(toDb = false) {
    if (activeSlideIdx < 0) { if (toDb) toast('Aucune étape à sauvegarder', 'error'); return; }
    const state = readEditorState();
    if (!state) return;

    const s = slides[activeSlideIdx];
    s.title = state.title;
    s.content = state.content;
    s.options = state.options;

    if (toDb) {
      if (!sessionId) {
        toast('❌ Session introuvable. Revenez au tableau de bord.', 'error');
        return;
      }

      const payload = {
        title: s.title,
        content: s.content,
        options: s.options,
        position: s.position,
        type: s.type
      };

      let ok;
      try {
        if (s.id) {
          ok = await DataStore.updateSlide(s.id, payload);
        } else {
          const result = await DataStore.addSlide(sessionId, payload);
          if (result) { s.id = result.id; ok = true; }
          else ok = false;
        }
      } catch (err) {
        console.error('Erreur de sauvegarde de slide:', err);
        ok = false;
      }

      if (ok) toast('✅ Sauvegardé !', 'success');
      else {
        console.error('Échec de sauvegarde de la slide', payload);
        toast('❌ Erreur de sauvegarde', 'error');
      }
    }

    renderSlideList();
  }

  // ── Add a new slide (local only, save on saveCurrentSlide) ────────
  async function addSlide(type) {
    await saveCurrentSlide(false);
    const newSlide = {
      id: null,
      type,
      position: slides.length,
      title: '',
      content: '',
      options: type === 'qcm' ? { choices: [{ text: '', correct: false }, { text: '', correct: false }], points: 1 }
             : type === 'vrai_faux' ? { correct_answer: 'vrai', points: 1 }
             : type === 'diapo' ? { slides: [{ title: '', body: '', img: '' }] }
             : {}
    };
    slides.push(newSlide);
    selectSlide(slides.length - 1);
  }

  // ── Delete a slide ────────────────────────────────────────────────
  async function deleteSlide(e, idx) {
    e.stopPropagation();
    if (!confirm('Supprimer cette étape ?')) return;
    const s = slides[idx];
    if (s.id) await DataStore.deleteSlide(s.id);
    slides.splice(idx, 1);
    slides.forEach((sl, i) => sl.position = i);
    if (activeSlideIdx >= slides.length) activeSlideIdx = slides.length - 1;
    if (slides.length === 0) {
      activeSlideIdx = -1;
      document.getElementById('editor-empty').style.display = 'flex';
      document.getElementById('slide-editor').style.display = 'none';
    } else {
      selectSlide(activeSlideIdx);
    }
    renderSlideList();
  }

  // ── Utils ─────────────────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function copyCode() {
    navigator.clipboard.writeText(sessionCode).then(() => toast('Code copié !', 'success'));
  }

  function toast(msg, type = 'success') {
    const c = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // ── Background particles ──────────────────────────────────────────
  (function() {
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function mkP() {
      return { x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        size: Math.random()*1.2+0.3, sy: -(Math.random()*0.25+0.08),
        sx: (Math.random()-0.5)*0.15, life: 0, maxLife: Math.random()*350+200 };
    }
    function init() { resize(); for(let i=0;i<60;i++) particles.push(mkP()); window.addEventListener('resize', resize); }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.x += p.sx; p.y += p.sy; p.life++;
        const r = p.life/p.maxLife;
        const a = r < 0.2 ? r/0.2 : r > 0.8 ? (1-r)/0.2 : 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(167,139,250,${a * 0.4})`;
        ctx.fill();
        if (p.life >= p.maxLife) particles[i] = mkP();
      });
      requestAnimationFrame(animate);
    }
    init(); animate();
  })();

  init();
</script>
</body>
