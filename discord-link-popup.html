<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Lier Discord - Mysteria RP</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    body {
      background: #02030a url('img/fond2.jpg') center center / cover no-repeat fixed;
      background-attachment: fixed;
    }

    .discord-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10001;
      backdrop-filter: blur(5px);
    }

    .discord-modal {
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 450px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px rgba(88,101,242,0.3);
      animation: slideUp 0.4s ease;
      text-align: center;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
    }

    .modal-title {
      font-family: 'Cinzel', serif;
      font-size: 1.5rem;
      color: var(--gold-light);
      margin-bottom: 0.75rem;
    }

    .modal-desc {
      color: var(--text-dim);
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .discord-badge {
      display: inline-block;
      background: rgba(88,101,242,0.2);
      border: 1px solid rgba(88,101,242,0.5);
      padding: 0.5rem 1rem;
      border-radius: 8px;
      color: #5865F2;
      font-weight: 600;
      margin-bottom: 1.5rem;
      font-size: 0.85rem;
    }

    .modal-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }

    .btn {
      flex: 1;
      padding: 0.85rem 1.25rem;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .btn-discord {
      background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-discord:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(88,101,242,0.4);
    }

    .btn-later {
      background: transparent;
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.3);
    }

    .btn-later:hover {
      border-color: var(--border-bright);
      background: rgba(201,168,76,0.05);
    }

    .info-box {
      background: rgba(88,101,242,0.1);
      border: 1px solid rgba(88,101,242,0.2);
      border-radius: 10px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: left;
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .info-box strong {
      color: var(--gold);
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <div class="discord-modal-overlay" id="discord-overlay">
    <div class="discord-modal">
      <div class="modal-icon">🔗</div>
      <div class="modal-title">Connecter Discord</div>
      <div class="discord-badge">Recommandé pour la sécurité</div>

      <div class="info-box">
        <strong>Pourquoi?</strong> Discord permet une authentification sécurisée et un accès facile à Mysteria RP.
      </div>

      <div class="modal-desc">
        Liez votre compte Discord à Mysteria pour continuer. C'est rapide et sécurisé.
      </div>

      <div class="modal-actions">
        <button class="btn btn-discord" id="connect-discord-btn" onclick="connectDiscord()">
          <span>🔗</span>
          <span>Se Connecter</span>
        </button>
        <button class="btn btn-later" onclick="dismissModal()">Plus tard</button>
      </div>
    </div>
  </div>

  <script src="js/discord-auth.js"></script>
  <script>
    function connectDiscord() {
      const btn = document.getElementById('connect-discord-btn');
      btn.classList.add('loading');
      btn.textContent = '⏳ Ouverture...';
      
      DiscordAuth.openDiscordLogin();

      const checkInterval = setInterval(() => {
        if (window.discordAuthData) {
          clearInterval(checkInterval);
          btn.classList.remove('loading');
          btn.textContent = '✅ Connecté !';
          
          // Attendre un peu puis fermer
          setTimeout(() => {
            window.close();
          }, 1500);
        }
      }, 500);

      // Timeout
      setTimeout(() => {
        clearInterval(checkInterval);
        if (!window.discordAuthData) {
          btn.classList.remove('loading');
          btn.textContent = '🔗 Se Connecter';
        }
      }, 30000);
    }

    function dismissModal() {
      localStorage.setItem('discord-prompt-dismissed', new Date().getTime());
      window.close();
    }

    // Particles
    (function() {
      const canvas = document.getElementById('particles-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      function createParticle() {
        return {
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 1.5 + 0.3,
          speedY: -(Math.random() * 0.3 + 0.1),
          speedX: (Math.random() - 0.5) * 0.2,
          opacity: Math.random() * 0.6 + 0.2,
          life: 0,
          maxLife: Math.random() * 300 + 200
        };
      }
      function init() {
        resize();
        for (let i = 0; i < 80; i++) particles.push(createParticle());
        window.addEventListener('resize', resize);
      }
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach((p, i) => {
          p.x += p.speedX;
          p.y += p.speedY;
          p.life++;
          const ratio = p.life / p.maxLife;
          const alpha = ratio < 0.2 ? ratio / 0.2 : ratio > 0.8 ? (1 - ratio) / 0.2 : 1;
          ctx.globalAlpha = p.opacity * alpha;
          ctx.fillStyle = '#c9a84c';
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
          if (p.life >= p.maxLife || p.y < 0) particles[i] = createParticle();
        });
        ctx.globalAlpha = 1;
        requestAnimationFrame(animate);
      }
      init();
      animate();
    })();
  </script>
</body>
</html>
