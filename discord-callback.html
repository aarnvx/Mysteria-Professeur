<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Discord Connexion...</title>
  <style>
    body {
      background: #1a1a2e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .loader {
      width: 50px;
      height: 50px;
      border: 4px solid #5865F2;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.2rem;
      margin: 0.5rem 0;
    }
    p {
      color: #999;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loader"></div>
    <h1>Connexion à Discord...</h1>
    <p>Veuillez patienter</p>
  </div>

  <script>
    // Récupérer le code d'autorisation
    const code = new URLSearchParams(window.location.search).get('code');
    const error = new URLSearchParams(window.location.search).get('error');

    if (error) {
      window.opener.postMessage({
        type: 'DISCORD_AUTH_ERROR',
        error: error
      }, window.location.origin);
      window.close();
    } else if (code) {
      // Envoyer le code au serveur backend (vous devez avoir un endpoint)
      fetch('/api/discord-callback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ code })
      })
        .then(res => res.json())
        .then(data => {
          window.opener.postMessage({
            type: 'DISCORD_AUTH_SUCCESS',
            user: data.user
          }, window.location.origin);
          window.close();
        })
        .catch(err => {
          window.opener.postMessage({
            type: 'DISCORD_AUTH_ERROR',
            error: err.message
          }, window.location.origin);
          window.close();
        });
    }
  </script>
</body>
</html>
