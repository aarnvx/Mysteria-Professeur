<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session en direct - Mysteria RP</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #a78bfa; --accent-dim: rgba(167,139,250,0.15); --accent-border: rgba(167,139,250,0.35); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Outfit', sans-serif; min-height: 100vh; color: var(--text); }

    canvas#bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

    .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Join Screen ── */
    .join-screen {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 2rem;
    }
    .join-card {
      background: var(--bg-card); border: 1px solid var(--border-bright);
      border-radius: 20px; padding: 3rem 2.5rem; max-width: 480px; width: 100%;
      box-shadow: var(--glow-strong); text-align: center;
      animation: fadeIn 0.5s ease;
    }
    .join-icon { font-size: 4rem; margin-bottom: 1.25rem; }
    .join-title { font-family: 'Cinzel', serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 0.4rem; }
    .join-sub { font-family: 'EB Garamond', serif; font-style: italic; color: var(--text-dim); margin-bottom: 2rem; font-size: 1rem; }

    .code-input-wrap {
      margin-bottom: 1.25rem;
    }
    .code-input {
      width: 100%; text-align: center; font-family: 'Cinzel', serif;
      font-size: 1.4rem; letter-spacing: 0.3em; text-transform: uppercase;
      background: rgba(10,10,18,0.6); border: 1px solid var(--border-bright);
      border-radius: 12px; padding: 0.9rem 1rem; color: var(--gold);
      outline: none; transition: border-color 0.3s;
    }
    .code-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(167,139,250,0.15); }
    .code-input::placeholder { color: rgba(201,168,76,0.3); letter-spacing: 0.1em; font-size: 1rem; }

    .join-error { color: #e87070; font-size: 0.82rem; margin-bottom: 1rem; display: none; }

    /* ── Session Header ── */
    .session-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 2rem; border-bottom: 1px solid var(--border);
      background: rgba(10,10,18,0.9); backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 50; flex-wrap: wrap; gap: 0.5rem;
    }
    .session-header-info { display: flex; flex-direction: column; gap: 0.1rem; }
    .session-header-title { font-family: 'Cinzel', serif; font-size: 0.95rem; color: var(--gold); }
    .session-header-meta { font-size: 0.75rem; color: var(--text-dim); }

    .session-progress {
      display: flex; align-items: center; gap: 0.75rem;
    }
    .progress-bar-wrap {
      width: 120px; height: 6px; background: var(--border);
      border-radius: 100px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent);
      border-radius: 100px; transition: width 0.5s ease;
    }
    .progress-label { font-family: 'Cinzel', serif; font-size: 0.72rem; color: var(--text-dim); }

    /* ── Slide Area ── */
    .slide-area {
      flex: 1; padding: 2.5rem 1.5rem;
      display: flex; flex-direction: column; align-items: center;
      max-width: 780px; margin: 0 auto; width: 100%;
    }

    .slide-type-badge {
      font-family: 'Cinzel', serif; font-size: 0.65rem; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--accent);
      background: var(--accent-dim); border: 1px solid var(--accent-border);
      padding: 0.25rem 0.75rem; border-radius: 100px; margin-bottom: 1rem;
    }
    .slide-question {
      font-family: 'Cinzel', serif; font-size: clamp(1.1rem, 3vw, 1.5rem);
      color: var(--gold-light); text-align: center; margin-bottom: 2rem;
      line-height: 1.6; max-width: 640px;
    }
    .slide-content-text {
      font-family: 'EB Garamond', serif; font-size: 1rem; color: var(--cream-dim);
      line-height: 1.8; margin-bottom: 1.5rem; text-align: center;
    }

    /* QCM options */
    .qcm-options {
      display: flex; flex-direction: column; gap: 0.6rem; width: 100%; max-width: 560px; margin-bottom: 1.5rem;
    }
    .qcm-option {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1.25rem; border-radius: 12px;
      background: var(--bg-card); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.25s; text-align: left;
    }
    .qcm-option:hover { border-color: var(--accent-border); background: var(--accent-dim); }
    .qcm-option.selected { border-color: var(--accent); background: var(--accent-dim); box-shadow: 0 0 0 2px var(--accent-border); }
    .qcm-option.correct { border-color: rgba(80,180,100,0.7); background: rgba(80,180,100,0.1); }
    .qcm-option.wrong { border-color: rgba(200,80,80,0.7); background: rgba(200,80,80,0.1); }
    .option-letter {
      width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--border-bright);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--gold);
      flex-shrink: 0;
    }
    .option-text { flex: 1; font-size: 0.95rem; color: var(--text); }

    /* Vrai / Faux */
    .vf-options {
      display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; justify-content: center;
    }
    .vf-btn {
      display: flex; flex-direction: column; align-items: center; gap: 0.5rem;
      padding: 1.5rem 3rem; border-radius: 16px;
      background: var(--bg-card); border: 1px solid var(--border);
      cursor: pointer; transition: all 0.25s; font-family: 'Cinzel', serif;
      font-size: 0.85rem; color: var(--text-dim); letter-spacing: 0.08em;
    }
    .vf-btn .vf-icon { font-size: 2.5rem; }
    .vf-btn:hover { border-color: var(--border-bright); transform: translateY(-2px); }
    .vf-btn.selected { border-color: var(--accent); background: var(--accent-dim); color: var(--accent); }

    /* Rédaction */
    .redac-box {
      width: 100%; max-width: 640px; margin-bottom: 1.5rem;
    }
    .redac-textarea {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border-bright);
      border-radius: 12px; padding: 1.25rem; font-family: 'EB Garamond', serif;
      font-size: 1rem; color: var(--text); outline: none;
      resize: vertical; min-height: 180px; transition: border-color 0.3s;
      line-height: 1.8;
    }
    .redac-textarea:focus { border-color: var(--accent); }
    .word-count { font-size: 0.78rem; color: var(--text-dim); margin-top: 0.4rem; text-align: right; }

    /* Photo upload */
    .photo-drop {
      width: 100%; max-width: 480px;
      border: 2px dashed var(--border-bright); border-radius: 16px;
      padding: 3rem 2rem; text-align: center;
      cursor: pointer; transition: all 0.3s; margin-bottom: 1.5rem;
    }
    .photo-drop:hover { border-color: var(--accent); background: var(--accent-dim); }
    .photo-drop-icon { font-size: 3rem; display: block; margin-bottom: 0.75rem; }
    .photo-preview { max-width: 100%; max-height: 240px; border-radius: 10px; margin-top: 0.75rem; }
    #photo-file { display: none; }

    /* Dessin canvas */
    .draw-wrap { position: relative; margin-bottom: 1.5rem; }
    #draw-canvas {
      border: 1px solid var(--border-bright); border-radius: 12px;
      cursor: crosshair; touch-action: none; display: block;
      max-width: 100%;
    }
    .draw-toolbar {
      display: flex; gap: 0.5rem; align-items: center;
      margin-bottom: 0.75rem; flex-wrap: wrap;
    }
    .draw-color { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: border-color 0.2s; }
    .draw-color.active { border-color: var(--gold); }
    .draw-size {
      font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--text-dim);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 6px;
      padding: 0.25rem 0.5rem; cursor: pointer; transition: border-color 0.2s;
    }
    .draw-size.active { border-color: var(--accent); color: var(--accent); }
    .draw-erase-btn {
      font-family: 'Cinzel', serif; font-size: 0.7rem; letter-spacing: 0.05em;
      background: none; border: 1px solid var(--border); border-radius: 6px;
      padding: 0.25rem 0.75rem; color: var(--text-dim); cursor: pointer;
    }
    .draw-erase-btn:hover { border-color: var(--border-bright); color: var(--text); }

    /* Diaporama */
    .diapo-wrap { width: 100%; max-width: 720px; margin-bottom: 1.5rem; }
    .diapo-slide-card {
      background: var(--bg-card); border: 1px solid var(--border-bright);
      border-radius: 16px; padding: 2rem; text-align: center; min-height: 300px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      animation: fadeIn 0.4s ease;
    }
    .diapo-slide-title { font-family: 'Cinzel', serif; font-size: 1.3rem; color: var(--gold); margin-bottom: 1rem; }
    .diapo-slide-body { font-family: 'EB Garamond', serif; font-size: 1.05rem; color: var(--cream-dim); line-height: 1.8; margin-bottom: 1rem; }
    .diapo-slide-img { max-width: 100%; max-height: 220px; border-radius: 10px; margin-top: 0.75rem; }
    .diapo-nav { display: flex; align-items: center; gap: 1.25rem; margin-top: 1.25rem; }
    .diapo-counter { font-family: 'Cinzel', serif; font-size: 0.8rem; color: var(--text-dim); }

    /* Nav buttons */
    .slide-nav {
      display: flex; gap: 0.75rem; align-items: center; justify-content: center;
      margin-top: auto; padding: 1.5rem 0;
    }

    /* Result screen */
    .result-screen {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; padding: 2rem; text-align: center;
    }
    .result-icon { font-size: 5rem; margin-bottom: 1.5rem; }
    .result-title { font-family: 'Cinzel', serif; font-size: 1.6rem; color: var(--gold); margin-bottom: 0.5rem; }
    .result-sub { font-family: 'EB Garamond', serif; font-style: italic; color: var(--text-dim); font-size: 1.1rem; margin-bottom: 2rem; }
    .result-score {
      font-family: 'Cinzel', serif; font-size: 3rem; font-weight: 700; color: var(--accent);
      margin-bottom: 0.5rem;
    }
    .result-score-label { font-size: 0.85rem; color: var(--text-dim); font-family: 'Cinzel', serif; letter-spacing: 0.1em; }
    .result-answers {
      width: 100%; max-width: 560px; margin-top: 2rem;
      display: flex; flex-direction: column; gap: 0.6rem; text-align: left;
    }
    .result-answer-row {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.85rem 1.1rem;
      display: flex; align-items: flex-start; gap: 0.75rem;
    }
    .ra-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 0.1rem; }
    .ra-body { flex: 1; }
    .ra-q { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 0.2rem; }
    .ra-a { font-size: 0.9rem; color: var(--text); }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Toast */
    #toast-c { position: fixed; bottom: 2rem; right: 2rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.5rem; }
    .toast { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 0.75rem 1.25rem; font-size: 0.85rem; color: var(--text); box-shadow: 0 8px 24px rgba(0,0,0,0.4); animation: toastIn 0.3s ease; }
    .toast.success { border-color: rgba(80,180,100,0.4); color: #7ddb8c; }
    .toast.error { border-color: rgba(200,80,80,0.4); color: #e87070; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
<canvas id="bg"></canvas>

<div class="page" id="page">

  <!-- JOIN SCREEN -->
  <div class="join-screen" id="join-screen">
    <div class="join-card">
      <div class="join-icon">📋</div>
      <h1 class="join-title">Rejoindre une Session</h1>
      <p class="join-sub">Entrez le code fourni par votre Professeur.</p>

      <div class="code-input-wrap">
        <input class="code-input" type="text" id="code-input" maxlength="12" placeholder="EX-ABCD" autocomplete="off" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')joinSession()" />
      </div>
      <div class="form-group" style="margin-bottom:1rem;">
        <label class="form-label" style="text-align:left; display:block;">Votre prénom Rôleplay *</label>
        <input class="form-input" id="student-name" placeholder="Ex: Hermione Granger" />
      </div>
      <div class="form-group" style="margin-bottom:1.5rem;">
        <label class="form-label" style="text-align:left; display:block;">Votre Steam ID (facultatif)</label>
        <input class="form-input" id="student-steam" placeholder="Ex: 7656..." />
      </div>
      <div class="join-error" id="join-error"></div>
      <button class="btn btn-primary" id="join-btn" onclick="joinSession()">🔮 Rejoindre la session</button>
    </div>
  </div>

  <!-- SESSION SCREEN (hidden initially) -->
  <div id="session-screen" style="display:none; flex-direction:column; flex:1;">

    <header class="session-header">
      <div class="session-header-info">
        <div class="session-header-title" id="sh-title">Session</div>
        <div class="session-header-meta" id="sh-meta">Prof. - Code</div>
      </div>
      <div class="session-progress">
        <div class="progress-bar-wrap"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
        <span class="progress-label" id="progress-label">0 / 0</span>
      </div>
    </header>

    <div class="slide-area" id="slide-area"></div>

    <!-- Slide nav -->
    <div class="slide-nav" id="slide-nav">
      <button class="btn btn-sm" id="btn-prev" onclick="prevSlide()" style="display:none;">← Précédent</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextSlide()" style="max-width:240px;">Suivant →</button>
    </div>

  </div>

  <!-- RESULT SCREEN (hidden initially) -->
  <div id="result-screen" style="display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; padding:2rem;">
    <div class="result-icon">🎉</div>
    <h2 class="result-title">Session terminée !</h2>
    <p class="result-sub">Vos réponses ont bien été transmises à votre Professeur.</p>
    <div class="result-score" id="result-score">-</div>
    <div class="result-score-label">points automatiques</div>
    <div class="result-answers" id="result-answers"></div>
    <div style="margin-top:2rem; display:flex; gap:0.75rem; flex-wrap:wrap; justify-content:center;">
      <a href="dashboard.html" class="btn">⚡ Retour au tableau de bord</a>
    </div>
  </div>

</div>

<div id="toast-c"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabaseClient.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/data.js"></script>
<script src="../js/global-sound.js"></script>
<script>
  // Guard: redirect to index if not authenticated
  const user = requireAuthOrRedirect();
  if (!user) {
    // requireAuthOrRedirect will redirect; stop further execution
  }
</script>
<script>
  let session = null;
  let slides = [];
  let currentIdx = 0;
  let studentName = '';
  let steamId = '';
  let answers = {}; // slideId -> answer value
  let diapoPage = 0;
  let drawCtx = null, drawing = false, drawColor = '#c9a84c', drawSize = 4;

  const SLIDE_LABELS = {
    qcm: '🧩 QCM', redaction: '✍️ Rédaction', photo: '🖼️ Envoi Photo',
    diapo: '📽️ Diaporama', vrai_faux: '✅ Vrai / Faux', dessin: '🎨 Dessin Libre'
  };

  // ── Join ──────────────────────────────────────────────────────────
  async function joinSession() {
    const code = document.getElementById('code-input').value.trim().toUpperCase();
    const name = document.getElementById('student-name').value.trim();
    const steam = document.getElementById('student-steam').value.trim();
    const errEl = document.getElementById('join-error');
    const btn = document.getElementById('join-btn');

    errEl.style.display = 'none';
    if (!code) { errEl.textContent = 'Veuillez entrer un code de session.'; errEl.style.display = 'block'; return; }
    if (!name) { errEl.textContent = 'Veuillez entrer votre prénom Rôleplay.'; errEl.style.display = 'block'; return; }

    btn.textContent = '⏳ Connexion...'; btn.disabled = true;

    const sessionData = await DataStore.getSessionByCode(code);
    if (!sessionData) {
      errEl.textContent = 'Code invalide ou session introuvable.'; errEl.style.display = 'block';
      btn.textContent = '🔮 Rejoindre la session'; btn.disabled = false; return;
    }

    if (!sessionData.active) {
      errEl.textContent = 'La session n\'a pas encore été lancée. Attendez votre professeur.';
      errEl.style.display = 'block';
      btn.textContent = '🔮 Rejoindre la session'; btn.disabled = false;
      return;
    }

    session = sessionData;
    slides = await DataStore.getSlides(session.id);
    if (slides.length === 0) {
      errEl.textContent = 'Cette session ne contient aucune question pour le moment.'; errEl.style.display = 'block';
      btn.textContent = '🔮 Rejoindre la session'; btn.disabled = false; return;
    }

    studentName = name;
    steamId = steam;

    document.getElementById('sh-title').textContent = session.label;
    document.getElementById('sh-meta').textContent = 'Prof. ' + session.teacher + ' · Code: ' + code;

    document.getElementById('join-screen').style.display = 'none';
    const ss = document.getElementById('session-screen');
    ss.style.display = 'flex'; ss.style.flexDirection = 'column'; ss.style.flex = '1';

    showSlide(0);
  }

  // ── Show a slide ──────────────────────────────────────────────────
  function showSlide(idx) {
    currentIdx = idx;
    diapoPage = 0;
    const s = slides[idx];
    const opts = typeof s.options === 'string' ? JSON.parse(s.options || '{}') : (s.options || {});

    // Progress
    const pct = Math.round(((idx + 1) / slides.length) * 100);
    document.getElementById('progress-fill').style.width = pct + '%';
    document.getElementById('progress-label').textContent = (idx + 1) + ' / ' + slides.length;

    // Prev/Next buttons
    document.getElementById('btn-prev').style.display = idx > 0 ? 'inline-flex' : 'none';
    const nextBtn = document.getElementById('btn-next');
    nextBtn.textContent = idx === slides.length - 1 ? '✅ Terminer la session' : 'Suivant →';

    const area = document.getElementById('slide-area');
    area.innerHTML = '';

    let html = `<span class="slide-type-badge">${SLIDE_LABELS[s.type] || s.type}</span>`;

    if (s.type === 'qcm') {
      const choices = opts.choices || [];
      html += `<div class="slide-question">${escHtml(s.title)}</div>`;
      html += `<div class="qcm-options" id="qcm-opts">`;
      choices.forEach((c, ci) => {
        const letter = String.fromCharCode(65 + ci);
        html += `<div class="qcm-option" id="opt-${ci}" onclick="selectQCM(${ci})" tabindex="0">
          <div class="option-letter">${letter}</div>
          <div class="option-text">${escHtml(c.text)}</div>
        </div>`;
      });
      html += `</div>`;
      // Restore selection
      if (answers[s.id] !== undefined) {
        setTimeout(() => selectQCM(answers[s.id], true), 50);
      }

    } else if (s.type === 'vrai_faux') {
      html += `<div class="slide-question">${escHtml(s.title)}</div>`;
      html += `<div class="vf-options">
        <div class="vf-btn ${answers[s.id] === 'vrai' ? 'selected' : ''}" id="vf-vrai" onclick="selectVF('vrai')">
          <span class="vf-icon">✅</span>Vrai
        </div>
        <div class="vf-btn ${answers[s.id] === 'faux' ? 'selected' : ''}" id="vf-faux" onclick="selectVF('faux')">
          <span class="vf-icon">❌</span>Faux
        </div>
      </div>`;

    } else if (s.type === 'redaction') {
      html += `<div class="slide-question">${escHtml(s.title)}</div>`;
      if (s.content) html += `<div class="slide-content-text">${escHtml(s.content)}</div>`;
      html += `<div class="redac-box">
        <textarea class="redac-textarea" id="redac-answer" placeholder="Rédigez votre réponse ici..." oninput="updateWordCount()">${escHtml(answers[s.id] || '')}</textarea>
        <div class="word-count" id="word-count">0 mots</div>
      </div>`;
      setTimeout(updateWordCount, 50);

    } else if (s.type === 'photo') {
      html += `<div class="slide-question">${escHtml(s.title)}</div>`;
      if (s.content) html += `<div class="slide-content-text">${escHtml(s.content)}</div>`;
      const accept = opts.accept || 'image/*';
      html += `<div class="photo-drop" onclick="document.getElementById('photo-file').click()">
        <span class="photo-drop-icon">📎</span>
        <div style="font-family:'Cinzel',serif; font-size:0.85rem; color:var(--text-dim);">Cliquez pour choisir un fichier</div>
        <div style="font-size:0.75rem; color:var(--text-dim); margin-top:0.3rem;">${accept.replace('image/*','Images')}</div>
        ${answers[s.id] ? `<img class="photo-preview" src="${answers[s.id]}" alt="preview"/>` : ''}
      </div>
      <input type="file" id="photo-file" accept="${accept}" onchange="handlePhotoUpload(event)" />`;

    } else if (s.type === 'dessin') {
      const sizes = { small: [400,300], medium: [600,400], large: [800,500] };
      const [cw, ch] = sizes[opts.canvas_size || 'medium'];
      html += `<div class="slide-question">${escHtml(s.title)}</div>`;
      if (s.content) html += `<div class="slide-content-text">${escHtml(s.content)}</div>`;
      html += `<div class="draw-toolbar">
        ${['#c9a84c','#ffffff','#e87070','#7ddb8c','#60a5fa','#f59e0b','#000000'].map(col =>
          `<div class="draw-color ${col===drawColor?'active':''}" style="background:${col}; width:${col==='#000000'?'28':'28'}px;" onclick="setDrawColor('${col}')" title="${col}"></div>`).join('')}
        <span style="font-size:0.75rem; color:var(--text-dim); margin-left:0.5rem;">Taille :</span>
        ${[2,4,8,16].map(sz => `<button class="draw-size ${sz===drawSize?'active':''}" onclick="setDrawSize(${sz})">${sz}px</button>`).join('')}
        <button class="draw-erase-btn" onclick="clearCanvas()">🗑 Effacer</button>
      </div>
      <div class="draw-wrap">
        <canvas id="draw-canvas" width="${cw}" height="${ch}" style="background:#0f0f1a;"></canvas>
      </div>`;
      setTimeout(() => initCanvas(), 50);

    } else if (s.type === 'diapo') {
      html += `<div class="slide-question">${escHtml(s.title)}</div>`;
      const dSlides = opts.slides || [];
      if (dSlides.length === 0) {
        html += `<div class="slide-content-text">Aucune diapositive disponible.</div>`;
      } else {
        html += `<div class="diapo-wrap">`;
        html += buildDiapoCard(dSlides, 0);
        html += `<div class="diapo-nav">
          <button class="btn btn-sm" id="d-prev" onclick="moveDiapo(-1)" ${diapoPage === 0 ? 'disabled' : ''}>◀</button>
          <span class="diapo-counter" id="d-counter">1 / ${dSlides.length}</span>
          <button class="btn btn-sm" id="d-next" onclick="moveDiapo(1)" ${diapoPage >= dSlides.length-1 ? 'disabled' : ''}>▶</button>
        </div></div>`;
      }
    }

    area.innerHTML = html;
  }

  function buildDiapoCard(dSlides, page) {
    const d = dSlides[page];
    return `<div class="diapo-slide-card" id="diapo-card">
      ${d.title ? `<div class="diapo-slide-title">${escHtml(d.title)}</div>` : ''}
      ${d.body ? `<div class="diapo-slide-body">${d.body.replace(/\n/g,'<br>')}</div>` : ''}
      ${d.img ? `<img class="diapo-slide-img" src="${escHtml(d.img)}" alt=""/>` : ''}
    </div>`;
  }

  function moveDiapo(dir) {
    const s = slides[currentIdx];
    const opts = typeof s.options === 'string' ? JSON.parse(s.options || '{}') : (s.options || {});
    const dSlides = opts.slides || [];
    diapoPage = Math.max(0, Math.min(dSlides.length - 1, diapoPage + dir));
    const wrap = document.querySelector('.diapo-wrap');
    if (wrap) {
      document.getElementById('diapo-card').outerHTML = buildDiapoCard(dSlides, diapoPage);
      document.getElementById('d-counter').textContent = (diapoPage + 1) + ' / ' + dSlides.length;
      document.getElementById('d-prev').disabled = diapoPage === 0;
      document.getElementById('d-next').disabled = diapoPage >= dSlides.length - 1;
    }
  }

  // ── Answer selection helpers ───────────────────────────────────────
  function selectQCM(ci, restore = false) {
    document.querySelectorAll('.qcm-option').forEach(el => el.classList.remove('selected'));
    const opt = document.getElementById(`opt-${ci}`);
    if (opt) opt.classList.add('selected');
    answers[slides[currentIdx].id] = ci;
  }

  function selectVF(val) {
    document.getElementById('vf-vrai')?.classList.toggle('selected', val === 'vrai');
    document.getElementById('vf-faux')?.classList.toggle('selected', val === 'faux');
    answers[slides[currentIdx].id] = val;
  }

  function updateWordCount() {
    const ta = document.getElementById('redac-answer');
    if (!ta) return;
    const words = ta.value.trim().split(/\s+/).filter(w => w).length;
    document.getElementById('word-count').textContent = words + ' mot' + (words > 1 ? 's' : '');
  }

  // ── Photo upload ──────────────────────────────────────────────────
  function handlePhotoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      answers[slides[currentIdx].id] = ev.target.result; // base64
      // Show preview
      const drop = document.querySelector('.photo-drop');
      if (drop) {
        const old = drop.querySelector('.photo-preview');
        if (old) old.remove();
        const img = document.createElement('img');
        img.src = ev.target.result;
        img.className = 'photo-preview';
        drop.appendChild(img);
      }
      toast('📎 Fichier sélectionné !', 'success');
    };
    reader.readAsDataURL(file);
  }

  // ── Drawing canvas ────────────────────────────────────────────────
  function initCanvas() {
    const canvas = document.getElementById('draw-canvas');
    if (!canvas) return;
    drawCtx = canvas.getContext('2d');
    // Restore if we have data
    if (answers[slides[currentIdx].id]) {
      const img = new Image();
      img.onload = () => drawCtx.drawImage(img, 0, 0);
      img.src = answers[slides[currentIdx].id];
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    }

    canvas.addEventListener('pointerdown', (e) => {
      drawing = true;
      const pos = getPos(e);
      drawCtx.beginPath();
      drawCtx.moveTo(pos.x, pos.y);
      e.preventDefault();
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      const pos = getPos(e);
      drawCtx.strokeStyle = drawColor;
      drawCtx.lineWidth = drawSize;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      drawCtx.lineTo(pos.x, pos.y);
      drawCtx.stroke();
      e.preventDefault();
    });
    canvas.addEventListener('pointerup', () => {
      drawing = false;
      answers[slides[currentIdx].id] = canvas.toDataURL();
    });
    canvas.addEventListener('pointerleave', () => { drawing = false; });
  }

  function setDrawColor(c) {
    drawColor = c;
    document.querySelectorAll('.draw-color').forEach(el => el.classList.toggle('active', el.style.background === c));
  }

  function setDrawSize(s) {
    drawSize = s;
    document.querySelectorAll('.draw-size').forEach(el => el.classList.toggle('active', el.textContent === s + 'px'));
    if (drawCtx) drawCtx.lineWidth = s;
  }

  function clearCanvas() {
    const canvas = document.getElementById('draw-canvas');
    if (!canvas || !drawCtx) return;
    drawCtx.clearRect(0, 0, canvas.width, canvas.height);
    delete answers[slides[currentIdx].id];
  }

  // ── Read current answer before navigating ────────────────────────
  function captureCurrentAnswer() {
    const s = slides[currentIdx];
    if (!s) return;
    if (s.type === 'redaction') {
      const ta = document.getElementById('redac-answer');
      if (ta) answers[s.id] = ta.value;
    } else if (s.type === 'dessin') {
      const canvas = document.getElementById('draw-canvas');
      if (canvas) answers[s.id] = canvas.toDataURL();
    }
  }

  // ── Navigation ────────────────────────────────────────────────────
  function prevSlide() {
    captureCurrentAnswer();
    if (currentIdx > 0) showSlide(currentIdx - 1);
  }

  async function nextSlide() {
    captureCurrentAnswer();
    const s = slides[currentIdx];

    // Save answer to DB
    let answerVal = answers[s.id];
    if (answerVal === undefined || answerVal === '') {
      // Allow skip for diapo/dessin/photo
      if (s.type === 'qcm' || s.type === 'vrai_faux') {
        toast('Veuillez sélectionner une réponse avant de continuer.', 'error');
        return;
      }
    }

    if (answerVal !== undefined) {
      const val = typeof answerVal === 'number' ? String(answerVal) : (answerVal || '');
      await DataStore.submitAnswer(session.id, s.id, studentName, steamId, val);
    }

    if (currentIdx < slides.length - 1) {
      showSlide(currentIdx + 1);
    } else {
      await showResults();
    }
  }

  // ── Results ───────────────────────────────────────────────────────
  async function showResults() {
    document.getElementById('session-screen').style.display = 'none';
    const rs = document.getElementById('result-screen');
    rs.style.display = 'flex';

    // Auto-calculate score for QCM/VF
    let score = 0;
    let maxScore = 0;
    const answerRows = [];

    slides.forEach(s => {
      const opts = typeof s.options === 'string' ? JSON.parse(s.options || '{}') : (s.options || {});
      const userAns = answers[s.id];

      if (s.type === 'qcm') {
        const pts = opts.points || 1;
        maxScore += pts;
        const correct = (opts.choices || []).findIndex(c => c.correct);
        const isCorrect = userAns !== undefined && parseInt(userAns) === correct;
        if (isCorrect) score += pts;
        const letter = userAns !== undefined ? String.fromCharCode(65 + parseInt(userAns)) : '?';
        answerRows.push({ q: s.title, a: letter + ' — ' + ((opts.choices||[])[parseInt(userAns)]?.text || '?'), ok: isCorrect, type: 'auto' });

      } else if (s.type === 'vrai_faux') {
        const pts = opts.points || 1;
        maxScore += pts;
        const isCorrect = userAns === opts.correct_answer;
        if (isCorrect) score += pts;
        answerRows.push({ q: s.title, a: userAns === 'vrai' ? '✅ Vrai' : '❌ Faux', ok: isCorrect, type: 'auto' });

      } else if (s.type === 'redaction') {
        answerRows.push({ q: s.title, a: (userAns || '(vide)').slice(0, 100) + ((userAns||'').length > 100 ? '…' : ''), ok: null, type: 'manual' });

      } else if (s.type === 'diapo') {
        // No answer needed
      } else {
        answerRows.push({ q: s.title, a: userAns ? '📎 Envoyé' : '(non envoyé)', ok: null, type: 'manual' });
      }
    });

    document.getElementById('result-score').textContent = score + ' / ' + maxScore;

    const cont = document.getElementById('result-answers');
    cont.innerHTML = answerRows.map(r => `
      <div class="result-answer-row">
        <div class="ra-icon">${r.ok === true ? '✅' : r.ok === false ? '❌' : '📝'}</div>
        <div class="ra-body">
          <div class="ra-q">${escHtml(r.q?.slice(0,80) || '')}</div>
          <div class="ra-a">${escHtml(r.a || '')}</div>
        </div>
      </div>
    `).join('');
  }

  // ── Utils ─────────────────────────────────────────────────────────
  function escHtml(str) {
    if (!str) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function toast(msg, type = 'success') {
    const c = document.getElementById('toast-c');
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.textContent = msg;
    c.appendChild(t);
    setTimeout(() => t.remove(), 3000);
  }

  // Check URL for auto-join
  (function() {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('code');
    if (code) document.getElementById('code-input').value = code.toUpperCase();
  })();

  // ── Background particles ──────────────────────────────────────────
  (function() {
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let particles = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    function mkP() {
      return { x: Math.random()*canvas.width, y: Math.random()*canvas.height,
        size: Math.random()*1.2+0.3, sy: -(Math.random()*0.25+0.08),
        sx: (Math.random()-0.5)*0.15, life: 0, maxLife: Math.random()*350+200 };
    }
    function init() { resize(); for(let i=0;i<60;i++) particles.push(mkP()); window.addEventListener('resize', resize); }
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        p.x += p.sx; p.y += p.sy; p.life++;
        const r = p.life/p.maxLife;
        const a = r < 0.2 ? r/0.2 : r > 0.8 ? (1-r)/0.2 : 1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(167,139,250,${a * 0.4})`;
        ctx.fill();
        if (p.life >= p.maxLife) particles[i] = mkP();
      });
      requestAnimationFrame(animate);
    }
    init(); animate();
  })();
</script>
</body>
