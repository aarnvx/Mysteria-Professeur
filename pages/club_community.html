<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Communauté du Club - Mysteria RP</title>
  <meta name="description" content="Espace communautaire du club : chat, posts, annonces." />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .community-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      margin-top: 2rem;
    }

    @media (max-width: 768px) {
      .community-container {
        grid-template-columns: 1fr;
      }
    }

    /* Chat Section */
    .chat-section {
      background: linear-gradient(135deg, rgba(25,25,50,0.8) 0%, rgba(15,15,40,0.9) 100%);
      border: 1px solid rgba(200,150,100,0.3);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      height: 500px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      padding-right: 0.5rem;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: rgba(100,100,150,0.1);
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(200,150,100,0.4);
      border-radius: 10px;
    }

    .chat-message {
      background: rgba(40,40,80,0.6);
      padding: 0.75rem;
      border-radius: 8px;
      border-left: 3px solid rgba(200,150,100,0.5);
      font-size: 0.9rem;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .chat-message-author {
      font-weight: 600;
      color: #c9a84c;
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }

    .chat-message-time {
      font-size: 0.75rem;
      color: rgba(200,200,200,0.5);
      display: inline-block;
      margin-left: 0.5rem;
    }

    .chat-input-area {
      display: flex;
      gap: 0.5rem;
    }

    .chat-input {
      flex: 1;
      background: rgba(30,30,60,0.8);
      border: 1px solid rgba(200,150,100,0.3);
      border-radius: 6px;
      padding: 0.75rem;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .chat-input:focus {
      outline: none;
      border-color: rgba(200,150,100,0.6);
      background: rgba(30,30,60,0.95);
    }

    .chat-btn {
      background: linear-gradient(135deg, #c9a84c 0%, #a68a3a 100%);
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chat-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(201,168,76,0.4);
    }

    /* Posts Section */
    .posts-section {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .post-form {
      background: linear-gradient(135deg, rgba(25,25,50,0.8) 0%, rgba(15,15,40,0.9) 100%);
      border: 1px solid rgba(200,150,100,0.3);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
    }

    .form-label {
      font-size: 0.85rem;
      color: #c9a84c;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }

    .form-input, .form-textarea {
      background: rgba(30,30,60,0.8);
      border: 1px solid rgba(200,150,100,0.3);
      border-radius: 6px;
      padding: 0.75rem;
      color: #fff;
      font-size: 0.9rem;
      font-family: inherit;
    }

    .form-textarea {
      resize: vertical;
      min-height: 80px;
    }

    .form-input:focus, .form-textarea:focus {
      outline: none;
      border-color: rgba(200,150,100,0.6);
      background: rgba(30,30,60,0.95);
    }

    .form-checkbox {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .form-checkbox input[type="checkbox"] {
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .post-btn {
      background: linear-gradient(135deg, #c9a84c 0%, #a68a3a 100%);
      border: none;
      border-radius: 6px;
      padding: 0.75rem 1.5rem;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      width: 100%;
    }

    .post-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(201,168,76,0.4);
    }

    /* Posts List */
    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 800px;
      overflow-y: auto;
      padding-right: 0.5rem;
    }

    .posts-list::-webkit-scrollbar {
      width: 6px;
    }

    .posts-list::-webkit-scrollbar-track {
      background: rgba(100,100,150,0.1);
      border-radius: 10px;
    }

    .posts-list::-webkit-scrollbar-thumb {
      background: rgba(200,150,100,0.4);
      border-radius: 10px;
    }

    .post-card {
      background: linear-gradient(135deg, rgba(25,25,50,0.6) 0%, rgba(15,15,40,0.8) 100%);
      border: 1px solid rgba(200,150,100,0.2);
      border-radius: 12px;
      padding: 1.25rem;
      transition: all 0.3s ease;
    }

    .post-card:hover {
      border-color: rgba(200,150,100,0.4);
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
    }

    .post-card.announcement {
      border-left: 4px solid #c9a84c;
      background: linear-gradient(135deg, rgba(60,50,20,0.6) 0%, rgba(40,30,15,0.8) 100%);
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .post-author {
      font-weight: 600;
      color: #c9a84c;
    }

    .post-badge {
      background: rgba(201,168,76,0.3);
      color: #c9a84c;
      padding: 0.25rem 0.75rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .post-time {
      font-size: 0.8rem;
      color: rgba(200,200,200,0.5);
    }

    .post-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .post-image {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 8px;
      margin: 0.75rem 0;
    }

    .post-content {
      color: rgba(255,255,255,0.85);
      font-size: 0.95rem;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .post-actions {
      display: flex;
      gap: 1rem;
      align-items: center;
      margin-bottom: 0.75rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgba(200,150,100,0.1);
    }

    .vote-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      color: rgba(200,200,200,0.7);
      font-size: 0.9rem;
      transition: all 0.3s ease;
      padding: 0.4rem 0.75rem;
      border-radius: 6px;
    }

    .vote-btn:hover {
      color: #c9a84c;
      background: rgba(201,168,76,0.1);
    }

    .vote-btn.voted {
      color: #c9a84c;
      font-weight: 600;
    }

    .comments-section {
      margin-top: 0.75rem;
    }

    .comment {
      background: rgba(30,30,60,0.5);
      padding: 0.75rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    .comment-author {
      font-weight: 600;
      color: #c9a84c;
      font-size: 0.85rem;
    }

    .comment-content {
      color: rgba(255,255,255,0.8);
      margin-top: 0.25rem;
    }

    .comment-form {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .comment-input {
      flex: 1;
      background: rgba(30,30,60,0.6);
      border: 1px solid rgba(200,150,100,0.2);
      border-radius: 6px;
      padding: 0.5rem;
      color: #fff;
      font-size: 0.85rem;
      font-family: inherit;
    }

    .comment-input:focus {
      outline: none;
      border-color: rgba(200,150,100,0.5);
    }

    .comment-btn {
      background: rgba(201,168,76,0.2);
      border: 1px solid rgba(201,168,76,0.4);
      border-radius: 6px;
      color: #c9a84c;
      cursor: pointer;
      padding: 0.5rem 1rem;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .comment-btn:hover {
      background: rgba(201,168,76,0.3);
      border-color: rgba(201,168,76,0.6);
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar" role="navigation" aria-label="Navigation principale">
    <ul>
      <li><a href="club_dashboard.html">🏠 Accueil</a></li>
      <li><a href="club_members.html">👥 Membres</a></li>
      <li id="club-config-nav-link" style="display:none;"><a href="configuration-clubs.html">⚙️ Configuration</a></li>
      <li><a href="club_points.html">⭐ Points</a></li>
      <li><a href="club_calendar.html">📅 Calendrier</a></li>
      <li><a href="club_community.html">💬 Communauté</a></li>
      <li><a href="club_hiboux.html">🦉 Hiboux</a></li>
      <li><a href="#" class="btn-logout" onclick="Auth.logout(); return false;">↩ Déconnexion</a></li>
    </ul>
  </nav>

  <main class="container" style="padding-top:3.5rem; padding-bottom:4rem; position:relative; z-index:1;">

    <!-- Hero -->
    <div class="club-hero">
      <div class="club-header">
        <div class="club-avatar-large" id="club-avatar">🎭</div>
        <div>
          <h1 id="club-name">Communauté du Club</h1>
          <p id="club-role-display" style="color:rgba(255,255,255,0.7);">Membre</p>
        </div>
      </div>
    </div>

    <!-- Community Content -->
    <div class="community-container">
      <!-- Chat Section (Left) -->
      <div class="chat-section">
        <h3 style="margin: 0 0 1rem 0; color: #c9a84c;">💬 Chat en Direct (24h)</h3>
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
          <input class="chat-input" id="chat-input" type="text" placeholder="Envoyer un message..." />
          <button class="chat-btn" onclick="sendChatMessage()">Envoyer</button>
        </div>
      </div>

      <!-- Posts Section (Right) -->
      <div class="posts-section">
        <!-- Post Form -->
        <div class="post-form">
          <h3 style="margin-top: 0; color: #c9a84c;">📝 Créer un Post</h3>
          <div class="form-group">
            <label class="form-label">Titre</label>
            <input class="form-input" id="post-title" type="text" placeholder="Titre du post..." />
          </div>
          <div class="form-group">
            <label class="form-label">Contenu</label>
            <textarea class="form-textarea" id="post-content" placeholder="Votre message..."></textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Image (URL)</label>
            <input class="form-input" id="post-image" type="url" placeholder="https://..." />
          </div>
          <div class="form-group form-checkbox">
            <input type="checkbox" id="post-is-announcement" />
            <label for="post-is-announcement" style="margin: 0; cursor: pointer;">📢 Marquer comme annonce</label>
          </div>
          <button class="post-btn" onclick="createPost()">Publier</button>
        </div>

        <!-- Posts List -->
        <div>
          <h3 style="color: #c9a84c; margin-top: 1rem;">📋 Posts</h3>
          <div class="posts-list" id="posts-list"></div>
        </div>
      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/data.js"></script>
  <script>
    const user = requireAuthOrRedirect();
    let currentClub = null;
    let chatSubscription = null;
    let postsSubscription = null;

    async function initCommunity() {
      try {
        // Récupérer le membre du club
        const clubMember = await DataStore.getClubMemberByEmail(user.email);
        if (!clubMember || !clubMember.club_id) {
          document.querySelector('main').innerHTML = '<div style="padding:2rem; color:red;">Accès non autorisé. Vous n\'êtes membre d\'aucun club.</div>';
          return;
        }

        currentClub = clubMember.club_id;
        document.getElementById('club-avatar').textContent = clubMember.avatar || '🎭';
        document.getElementById('club-name').textContent = clubMember.club_name || 'Club';
        document.getElementById('club-role-display').textContent = clubMember.role || 'Membre';

        // Afficher le lien config si manager
        if (clubMember.role && clubMember.role.toLowerCase().includes('manager')) {
          document.getElementById('club-config-nav-link').style.display = 'block';
        }

        loadChatMessages();
        loadPosts();
        subscribeToChat();
        subscribeToPosts();
      } catch (err) {
        console.error('Erreur initialisation communauté:', err);
      }
    }

    async function loadChatMessages() {
      try {
        const messages = await DataStore.getClubMessages(currentClub);
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        messages.forEach(msg => {
          const el = document.createElement('div');
          el.className = 'chat-message';
          const time = new Date(msg.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
          el.innerHTML = `
            <div class="chat-message-author">${msg.author_name}<span class="chat-message-time">${time}</span></div>
            <div>${msg.message}</div>
          `;
          container.appendChild(el);
        });
        container.scrollTop = container.scrollHeight;
      } catch (err) {
        console.error('Erreur chargement chat:', err);
      }
    }

    async function loadPosts() {
      try {
        const posts = await DataStore.getClubPosts(currentClub);
        const container = document.getElementById('posts-list');
        container.innerHTML = '';
        
        posts.forEach(post => {
          const el = renderPostCard(post);
          container.appendChild(el);
        });
      } catch (err) {
        console.error('Erreur chargement posts:', err);
      }
    }

    function renderPostCard(post) {
      const el = document.createElement('div');
      el.className = 'post-card' + (post.is_announcement ? ' announcement' : '');
      el.id = `post-${post.id}`;

      const time = new Date(post.created_at).toLocaleString('fr-FR');
      let html = `
        <div class="post-header">
          <div>
            <div class="post-author">${post.author_name}</div>
            <div class="post-time">${time}</div>
          </div>
          ${post.is_announcement ? '<div class="post-badge">📢 Annonce</div>' : ''}
        </div>
        <div class="post-title">${post.title}</div>
      `;

      if (post.image_url) {
        html += `<img src="${post.image_url}" alt="Image du post" class="post-image" onerror="this.style.display='none'" />`;
      }

      if (post.content) {
        html += `<div class="post-content">${post.content}</div>`;
      }

      html += `
        <div class="post-actions">
          <button class="vote-btn" onclick="votePost('${post.id}', 1)">
            👍 <span id="likes-${post.id}">0</span>
          </button>
          <button class="vote-btn" onclick="votePost('${post.id}', -1)">
            👎 <span id="dislikes-${post.id}">0</span>
          </button>
        </div>
        <div class="comments-section" id="comments-${post.id}"></div>
        <div class="comment-form">
          <input class="comment-input" id="comment-input-${post.id}" type="text" placeholder="Ajouter un commentaire..." />
          <button class="comment-btn" onclick="addComment('${post.id}')">Poster</button>
        </div>
      `;

      el.innerHTML = html;
      loadPostVotes(post.id);
      loadPostComments(post.id);
      return el;
    }

    async function loadPostVotes(postId) {
      try {
        const votes = await DataStore.getPostVotes(postId);
        const likes = votes.filter(v => v.vote_type === 1).length;
        const dislikes = votes.filter(v => v.vote_type === -1).length;
        document.getElementById(`likes-${postId}`).textContent = likes;
        document.getElementById(`dislikes-${postId}`).textContent = dislikes;
      } catch (err) {
        console.error('Erreur chargement votes:', err);
      }
    }

    async function loadPostComments(postId) {
      try {
        const comments = await DataStore.getPostComments(postId);
        const container = document.getElementById(`comments-${postId}`);
        container.innerHTML = '';
        comments.forEach(comment => {
          const el = document.createElement('div');
          el.className = 'comment';
          el.innerHTML = `
            <div class="comment-author">${comment.author_name}</div>
            <div class="comment-content">${comment.content}</div>
          `;
          container.appendChild(el);
        });
      } catch (err) {
        console.error('Erreur chargement commentaires:', err);
      }
    }

    async function sendChatMessage() {
      const input = document.getElementById('chat-input');
      const message = input.value.trim();
      if (!message) return;

      try {
        await DataStore.sendClubMessage(currentClub, user.email, user.name || user.email, message);
        input.value = '';
        await loadChatMessages();
      } catch (err) {
        console.error('Erreur envoi message:', err);
      }
    }

    async function createPost() {
      const title = document.getElementById('post-title').value.trim();
      const content = document.getElementById('post-content').value.trim();
      const imageUrl = document.getElementById('post-image').value.trim();
      const isAnnouncement = document.getElementById('post-is-announcement').checked;

      if (!title) {
        alert('Le titre est requis.');
        return;
      }

      try {
        await DataStore.createClubPost(currentClub, user.email, user.name || user.email, {
          title,
          content: content || null,
          image_url: imageUrl || null,
          is_announcement: isAnnouncement
        });

        document.getElementById('post-title').value = '';
        document.getElementById('post-content').value = '';
        document.getElementById('post-image').value = '';
        document.getElementById('post-is-announcement').checked = false;

        await loadPosts();
      } catch (err) {
        console.error('Erreur création post:', err);
      }
    }

    async function votePost(postId, voteType) {
      try {
        await DataStore.voteOnPost(postId, user.email, voteType);
        await loadPostVotes(postId);
      } catch (err) {
        console.error('Erreur vote:', err);
      }
    }

    async function addComment(postId) {
      const input = document.getElementById(`comment-input-${postId}`);
      const content = input.value.trim();
      if (!content) return;

      try {
        await DataStore.addPostComment(postId, user.email, user.name || user.email, content);
        input.value = '';
        await loadPostComments(postId);
      } catch (err) {
        console.error('Erreur commentaire:', err);
      }
    }

    function subscribeToChat() {
      chatSubscription = DataStore.subscribeTable({
        table: 'club_messages',
        events: ['INSERT'],
        filter: `club_id=eq.${currentClub}`,
        onEvent: () => loadChatMessages()
      });
    }

    function subscribeToPosts() {
      postsSubscription = DataStore.subscribeTable({
        table: 'club_posts',
        events: ['INSERT'],
        filter: `club_id=eq.${currentClub}`,
        onEvent: () => loadPosts()
      });
    }

    window.addEventListener('beforeunload', () => {
      if (chatSubscription) DataStore.unsubscribeChannel(chatSubscription);
      if (postsSubscription) DataStore.unsubscribeChannel(postsSubscription);
    });

    initCommunity();
  </script>
</body>
</html>
