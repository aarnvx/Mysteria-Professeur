<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Session en cours - Poudlard RP</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .session-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    .session-icon {
      font-size: 5rem;
      margin-bottom: 1.5rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .session-type-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-family: 'Cinzel', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 0.3rem 1rem;
      border-radius: 100px;
      background: rgba(201,168,76,0.12);
      border: 1px solid var(--border-bright);
      color: var(--gold);
      margin-bottom: 1.25rem;
    }

    .session-title {
      font-family: 'Cinzel', serif;
      font-size: clamp(1.6rem, 4vw, 2.5rem);
      font-weight: 700;
      color: var(--gold-light);
      margin-bottom: 0.75rem;
      max-width: 600px;
    }

    .session-meta {
      color: var(--text-dim);
      font-family: 'EB Garamond', serif;
      font-style: italic;
      font-size: 1.05rem;
      margin-bottom: 2.5rem;
    }

    .session-card {
      background: var(--bg-card);
      border: 1px solid var(--border-bright);
      border-radius: 16px;
      padding: 2.5rem 3rem;
      max-width: 560px;
      width: 100%;
      box-shadow: var(--glow-strong);
    }

    .session-instruction {
      font-family: 'EB Garamond', serif;
      font-size: 1.05rem;
      color: var(--cream-dim);
      line-height: 1.8;
      margin-bottom: 1.5rem;
    }

    .session-info-row {
      display: flex;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .session-info-item {
      flex: 1;
      background: rgba(201,168,76,0.06);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem;
      text-align: center;
    }

    .session-info-label {
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }

    .session-info-value {
      font-family: 'Cinzel', serif;
      font-size: 0.88rem;
      color: var(--gold-light);
      font-weight: 600;
    }

    .back-btn {
      margin-top: 2rem;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Cinzel', serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 1.2rem;
      background: transparent;
      cursor: pointer;
      transition: all 0.3s;
      text-decoration: none;
    }

    .back-btn:hover {
      color: var(--gold);
      border-color: var(--border-bright);
    }
  </style>
</head>
<body>
  <canvas id="particles-canvas"></canvas>

  <div class="session-hero">
    <div class="session-icon">📋</div>
    <span class="session-type-badge" id="session-type-badge">Session</span>
    <div class="session-title" id="session-label">Chargement…</div>
    <div class="session-meta" id="session-meta"></div>

    <div class="session-card">
      <div class="session-info-row">
        <div class="session-info-item">
          <div class="session-info-label">Code</div>
          <div class="session-info-value" id="session-code-disp">-</div>
        </div>
        <div class="session-info-item">
          <div class="session-info-label">Rejoint à</div>
          <div class="session-info-value" id="session-joined">-</div>
        </div>
      </div>

      <p class="session-instruction">
        Vous avez rejoint la session avec succès. Suivez les instructions de votre professeur et attendez que la session soit officiellement ouverte.
      </p>

      <div style="background:rgba(201,168,76,0.06); border:1px solid var(--border); border-radius:10px; padding:1rem; font-family:'Cinzel',serif; font-size:0.78rem; letter-spacing:0.05em; color:var(--gold-dim);">
        🔔 Restez attentif aux consignes de votre professeur dans le jeu.
      </div>
    </div>

    <a href="../index.html" class="back-btn" onclick="localStorage.removeItem('poudlard_session'); return true;">
      ← Quitter la session
    </a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    const raw = localStorage.getItem('poudlard_session');
    if (!raw) { window.location.href = '../index.html'; }

    const session = JSON.parse(raw || '{}');

    const TYPE_ICONS = { exam: '📝', homework: '📄', course: '📚', demo: '🔬' };
    const TYPE_LABELS = { exam: 'Examen', homework: 'Devoir', course: 'Cours', demo: 'Démo' };

    document.getElementById('session-label').textContent = session.label || 'Session';
    document.getElementById('session-meta').textContent = session.teacher ? 'Par ' + session.teacher : '';
    document.getElementById('session-type-badge').textContent = (TYPE_ICONS[session.type] || '📋') + ' ' + (TYPE_LABELS[session.type] || 'Session');
    document.getElementById('session-code-disp').textContent = session.code || '-';
    document.getElementById('session-joined').textContent = session.joinedAt
      ? new Date(session.joinedAt).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' })
      : '-';

    // Particles
    (function() {
      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      function resize() { canvas.width=window.innerWidth; canvas.height=window.innerHeight; }
      function createParticle() {
        return { x:Math.random()*canvas.width, y:Math.random()*canvas.height,
          size:Math.random()*1.2+0.3, speedY:-(Math.random()*0.25+0.08),
          speedX:(Math.random()-0.5)*0.15, opacity:Math.random()*0.5+0.15,
          life:0, maxLife:Math.random()*350+200 };
      }
      function init() { resize(); for(let i=0;i<60;i++) particles.push(createParticle()); window.addEventListener('resize',resize); }
      function animate() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        particles.forEach((p,i)=>{
          p.x+=p.speedX; p.y+=p.speedY; p.life++;
          const r=p.life/p.maxLife;
          const a=r<0.2?r/0.2:r>0.8?(1-r)/0.2:1;
          ctx.globalAlpha=p.opacity*a; ctx.fillStyle='#c9a84c';
          ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
          if(p.life>=p.maxLife||p.y<0) particles[i]=createParticle();
        });
        ctx.globalAlpha=1; requestAnimationFrame(animate);
      }
      init(); animate();
    })();
  </script>
</body>
</html>
