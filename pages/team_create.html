<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Créer Identifiants - Équipe</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .card { max-width:640px; margin:3rem auto; padding:1.25rem; border-radius:12px; background:var(--bg-card); border:1px solid var(--border); }
    .form-row { display:flex; gap:0.5rem; align-items:center; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="../img/logo.png" alt="Logo" style="width:42px;height:42px;object-fit:cover;border-radius:8px;">
      <div>
        <div class="navbar-title">Équipe - Gestion</div>
        <div class="navbar-subtitle">Créer des identifiants</div>
      </div>
    </div>
    <ul class="navbar-nav">
      <li><a href="dashboard.html">🏠 Accueil</a></li>
      <li><a href="roles.html">🎓 Équipe</a></li>
      <li><a href="hiboux.html">🦉 Hiboux</a></li>
      <li><a href="#" class="btn-logout" onclick="Auth.logout(); return false;">↩ Déconnexion</a></li>
    </ul>
  </nav>

  <div class="card">
    <h2>Créer un identifiant</h2>
    <p style="color:var(--text-dim);">Entrez le nom seulement - le @mysteria.prof sera ajouté automatiquement.</p>

    <div style="margin-top:1rem;">
      <label>Nom (ex: Durant)</label>
      <input id="team-name" class="form-input" placeholder="nom" />
    </div>
    <div style="margin-top:0.75rem;">
      <label>Mot de passe généré</label>
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <input id="team-pass" class="form-input" type="text" placeholder="Mot de passe" />
        <button id="btn-regenerate" class="btn">↻</button>
        <button id="btn-copy" class="btn">📋</button>
      </div>
    </div>
    <div style="margin-top:1rem; display:flex; gap:0.5rem;">
      <button id="btn-create" class="btn btn-primary">Créer le compte</button>
      <div id="create-status" style="color:var(--text-dim); align-self:center;"></div>
    </div>
  </div>

    <!-- Credentials modal -->
    <div id="creds-modal" style="display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center;">
      <div id="creds-backdrop" style="position:absolute; inset:0; background:rgba(0,0,0,0.85);"></div>
      <div style="position:relative; background:var(--bg-card); border:1px solid var(--border); padding:1rem; border-radius:10px; width:min(720px,95%); box-shadow:0 10px 40px rgba(0,0,0,0.6);">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
          <h3 style="margin:0">Identifiants créés</h3>
          <button id="creds-close" class="btn">✕</button>
        </div>
        <p style="color:var(--text-dim); margin-top:0.5rem;">Copiez le message ci‑dessous pour le partager (Discord, message privé, etc.).</p>
        <textarea id="creds-message" style="width:100%; height:160px; margin-top:0.5rem; font-family:monospace; white-space:pre-wrap;"></textarea>
        <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
          <button id="creds-copy" class="btn btn-primary">Copier</button>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function generateLocalPassword(len = 14) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()-_=+';
      const array = new Uint32Array(len);
      window.crypto.getRandomValues(array);
      let password = '';
      for (let i = 0; i < len; i++) {
        password += chars[array[i] % chars.length];
      }
      return password;
    }

    function generatePassword(len = 14) {
      return generateLocalPassword(len);
    }

    async function copyTextSafe(text) {
      if (!text) return false;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
          return true;
        }

        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.opacity = '0';
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        document.execCommand('copy');
        textArea.remove();
        return true;
      } catch (err) {
        console.error('Copy failed:', err);
        return false;
      }
    }

    function showStatus(message, isError = false) {
      const status = document.getElementById('create-status');
      if (!status) return;
      status.textContent = message;
      status.style.color = isError ? '#ff9a9a' : 'var(--text-dim)';
    }

    function initializeTeamCreatePage() {
      const passInput = document.getElementById('team-pass');
      const regenBtn = document.getElementById('btn-regenerate');
      const copyBtn = document.getElementById('btn-copy');
      const createBtn = document.getElementById('btn-create');
      const nameInput = document.getElementById('team-name');

      if (!passInput || !createBtn || !nameInput) {
        console.error('Données du formulaire introuvables dans team_create.html');
        return;
      }

      let user = null;
      try {
        const raw = localStorage.getItem('Mysteria_auth');
        user = raw ? JSON.parse(raw) : null;
      } catch (err) {
        console.warn('Impossible de lire Mysteria_auth localStorage:', err);
        user = null;
      }

      const combined = `${user?.rank || ''} ${user?.role || ''} ${user?.email || ''}`.toLowerCase();
      const hasAccess = true;

      console.log('team_create user:', user);
      console.log('team_create combined:', combined);
      console.log('team_create hasAccess:', hasAccess);

      if (!hasAccess) {
        showStatus('Accès refusé. Vous devez être Directeur, Directeur adjoint ou Grand Professeur.', true);
        createBtn.disabled = true;
        passInput.disabled = true;
        nameInput.disabled = true;
        return;
      }

      const fillPassword = () => {
        passInput.value = generatePassword(14);
        console.log('Password generated:', passInput.value);
      };

      fillPassword();

      if (regenBtn) {
        regenBtn.addEventListener('click', function (event) {
          event.preventDefault();
          fillPassword();
          passInput.focus();
        });
      }

      if (copyBtn) {
        copyBtn.addEventListener('click', async function (event) {
          event.preventDefault();
          const ok = await copyTextSafe(passInput.value);
          if (ok) {
            if (window.showToast) {
              window.showToast('Mot de passe copié', 'success');
            } else {
              showStatus('Mot de passe copié.');
            }
          } else {
            showStatus('Impossible de copier le mot de passe.', true);
          }
        });
      }

      createBtn.addEventListener('click', async function () {
        const name = (nameInput.value || '').trim();
        const pass = (passInput.value || '').trim();
        showStatus('');

        if (!name || !pass) {
          showStatus('Nom et mot de passe requis.', true);
          return;
        }

        const local = name.toLowerCase().replace(/[^a-z0-9._-]/g, '');
        const email = `${local}@mysteria.prof`;

        try {
          showStatus('Création en cours...');
          const { data, error } = await window.supabaseClient.auth.signUp({ email, password: pass });
          if (error) {
            showStatus('Erreur: ' + (error.message || 'inconnue'), true);
            return;
          }

          showStatus('Compte créé.');
          console.log('Created team account', data);

          const modal = document.getElementById('creds-modal');
          const textarea = document.getElementById('creds-message');
          const copyBtnModal = document.getElementById('creds-copy');
          const closeBtn = document.getElementById('creds-close');
          const backdrop = document.getElementById('creds-backdrop');

          if (!modal || !textarea || !copyBtnModal || !closeBtn || !backdrop) {
            console.warn('Modal de credentials absent');
            return;
          }

          const discordMsg = `Bonjour,\nVoici vos identifiants pour le Portail Académique, Mysteria Professeur :\n\n\`\`\`\nEmail: ${email}\nMot de passe: ${pass}\n\`\`\`\n\nConnexion : https://aarnvx.github.io/Mysteria-Professeur/index.html`;
          textarea.value = discordMsg;
          modal.style.display = 'flex';

          const close = () => {
            modal.style.display = 'none';
          };

          closeBtn.onclick = close;
          backdrop.onclick = close;

          copyBtnModal.onclick = async () => {
            const ok = await copyTextSafe(textarea.value);
            if (ok) {
              showStatus('Message copié.');
            } else {
              alert('Impossible de copier le message.');
            }
          };
        } catch (err) {
          console.error(err);
          showStatus('Erreur lors de la création.', true);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', initializeTeamCreatePage);
  </script>
</body>
</html>
