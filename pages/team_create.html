<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Créer Identifiants - Équipe</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .card { max-width:640px; margin:3rem auto; padding:1.25rem; border-radius:12px; background:var(--bg-card); border:1px solid var(--border); }
    .form-row { display:flex; gap:0.5rem; align-items:center; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-brand">
      <img src="../img/logo.png" alt="Logo" style="width:42px;height:42px;object-fit:cover;border-radius:8px;">
      <div>
        <div class="navbar-title">Équipe - Gestion</div>
        <div class="navbar-subtitle">Créer des identifiants</div>
      </div>
    </div>
    <ul class="navbar-nav">
      <li><a href="dashboard.html">🏠 Accueil</a></li>
      <li><a href="roles.html">🎓 Équipe</a></li>
      <li><a href="hiboux.html">🦉 Hiboux</a></li>
      <li><a href="#" class="btn-logout" onclick="Auth.logout(); return false;">↩ Déconnexion</a></li>
    </ul>
  </nav>

  <div class="card">
    <h2>Créer un identifiant</h2>
    <p style="color:var(--text-dim);">Entrez le nom seulement - le @mysteria.prof sera ajouté automatiquement.</p>

    <div style="margin-top:1rem;">
      <label>Nom (ex: Durant)</label>
      <input id="team-name" class="form-input" placeholder="nom" />
    </div>
    <div style="margin-top:0.75rem;">
      <label>Mot de passe généré</label>
      <div style="display:flex; gap:0.5rem; align-items:center;">
        <input id="team-pass" class="form-input" type="text" placeholder="Mot de passe" />
        <button id="btn-regenerate" class="btn">↻</button>
        <button id="btn-copy" class="btn">📋</button>
      </div>
    </div>
    <div style="margin-top:1rem; display:flex; gap:0.5rem;">
      <button id="btn-create" class="btn btn-primary">Créer le compte</button>
      <div id="create-status" style="color:var(--text-dim); align-self:center;"></div>
    </div>
  </div>

    <!-- Credentials modal -->
    <div id="creds-modal" style="display:none; position:fixed; inset:0; z-index:9999; align-items:center; justify-content:center;">
      <div id="creds-backdrop" style="position:absolute; inset:0; background:rgba(0,0,0,0.85);"></div>
      <div style="position:relative; background:var(--bg-card); border:1px solid var(--border); padding:1rem; border-radius:10px; width:min(720px,95%); box-shadow:0 10px 40px rgba(0,0,0,0.6);">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
          <h3 style="margin:0">Identifiants créés</h3>
          <button id="creds-close" class="btn">✕</button>
        </div>
        <p style="color:var(--text-dim); margin-top:0.5rem;">Copiez le message ci‑dessous pour le partager (Discord, message privé, etc.).</p>
        <textarea id="creds-message" style="width:100%; height:160px; margin-top:0.5rem; font-family:monospace; white-space:pre-wrap;"></textarea>
        <div style="display:flex; gap:0.5rem; margin-top:0.5rem;">
          <button id="creds-copy" class="btn btn-primary">Copier</button>
        </div>
      </div>
    </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/supabaseClient.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    function generatePassword(len = 14) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*()-_=+';
      const array = new Uint32Array(len);
      window.crypto.getRandomValues(array);
      return Array.from(array).map(x => chars[x % chars.length]).join('');
    }

    // Guard: only high-rank users can create accounts here
    const user = Auth.getCurrentUser();
    if (!Auth.hasPermission('manage_roles')) {
      document.body.innerHTML = '<div style="padding:3rem; text-align:center; color:var(--text-dim);">Accès refusé.</div>';
    } else {
      // Only initialize if access is granted
      setTimeout(() => {
        const passInput = document.getElementById('team-pass');
        const regenBtn = document.getElementById('btn-regenerate');
        const copyBtn = document.getElementById('btn-copy');
        if (passInput) passInput.value = generatePassword(14);
        if (regenBtn) regenBtn.addEventListener('click', (e) => { e.preventDefault(); passInput.value = generatePassword(14); passInput.focus(); });
        if (copyBtn) copyBtn.addEventListener('click', async (e) => {
          e.preventDefault();
          try { await navigator.clipboard.writeText(passInput.value); showToast('Mot de passe copié dans le presse-papiers', 'success'); }
          catch (err) { console.warn('copy failed', err); alert('Impossible de copier.'); }
        });
      }, 0);
    }

    document.getElementById('btn-create').addEventListener('click', async () => {
      const name = (document.getElementById('team-name').value || '').trim();
      const pass = (passInput.value || '').trim();
      const status = document.getElementById('create-status');
      status.textContent = '';
      if (!name || !pass) { status.textContent = 'Nom et mot de passe requis.'; return; }
      // simple sanitization for local part
      const local = name.toLowerCase().replace(/[^a-z0-9._-]/g, '');
      // Supabase requires a valid email address; we append an internal test domain
      const email = `${local}@mysteria.prof`;
      try {
        status.textContent = 'Création en cours...';
        const { data, error } = await window.supabaseClient.auth.signUp({ email, password: pass });
        if (error) {
          status.textContent = 'Erreur: ' + (error.message || error);
          return;
        }
        status.textContent = 'Compte créé.';
        console.log('Created team account', data);
        // Show credentials modal with a Discord-ready message
        (function showCredentials(emailAddr, pwd) {
          const modal = document.getElementById('creds-modal');
          const textarea = document.getElementById('creds-message');
          const copyBtn = document.getElementById('creds-copy');
          const copyCredsBtn = document.getElementById('creds-copy-creds');
          const closeBtn = document.getElementById('creds-close');
          const backdrop = document.getElementById('creds-backdrop');
          const site = window.location.origin + (window.location.pathname.endsWith('/') ? '' : '/');
          const discordMsg = `Bonjour,\nVoici vos identifiants pour le Portail Académique, Mysteria Professeur :\n\n\`\`\`\nEmail: ${emailAddr}\nMot de passe: ${pwd}\n\`\`\`\n\nConnexion : https://aarnvx.github.io/Mysteria-Professeur/index.html
          textarea.value = discordMsg;
          modal.style.display = 'flex';

          function close() { modal.style.display = 'none'; }
          closeBtn.onclick = close;
          backdrop.onclick = close;
          copyBtn.onclick = async () => {
            try { await navigator.clipboard.writeText(textarea.value); status.textContent = 'Message copié.'; }
            catch (e) { alert('Impossible de copier.'); }
          };
          copyCredsBtn.onclick = async () => {
            try { await navigator.clipboard.writeText(`Email: ${emailAddr}\nMot de passe: ${pwd}`); status.textContent = 'Identifiants copiés.'; }
            catch (e) { alert('Impossible de copier.'); }
          };
        })(email, pass);
      } catch (err) {
        status.textContent = 'Erreur lors de la création.';
        console.error(err);
      }
    });
  </script>
</body>
</html>
